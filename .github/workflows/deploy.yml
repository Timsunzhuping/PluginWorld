name: deploy
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [daily-community-scan]
    branches: [main]
    types: [completed]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      # Daily scan commits are pushed by GITHUB_TOKEN, so workflow_run is required.
      # Always deploy current main, not the pre-scan head_sha.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build and validate away from the production server
        run: npm ci && npm run typecheck && npm run lint && npm test && npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Configure dedicated deployment identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ] || [ -z "$DEPLOY_HOST" ]; then
            echo 'Deployment identity is not configured: SSH key, host and verified known_hosts are required.' >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/pluginworld_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/pluginworld_deploy ~/.ssh/known_hosts
      - name: Publish source archive, validate, build and switch with rollback
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          RELEASE_SHA=$(git rev-parse HEAD)
          mkdir release
          git archive HEAD | tar -x -C release
          cp -a .next release/.next
          rm -rf release/.next/cache
          printf '%s\n' "$RELEASE_SHA" > release/.build-commit
          tar -czf - -C release . | \
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/pluginworld_deploy \
            "$DEPLOY_HOST" "deploy $RELEASE_SHA"
      - name: Public production acceptance
        run: |
          node scripts/deploy/check-production.mjs https://pluginworld.ai
