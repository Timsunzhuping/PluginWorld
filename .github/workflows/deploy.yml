name: deploy
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [daily-community-scan]
    branches: [main]
    types: [completed]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      # Daily scan commits are pushed by GITHUB_TOKEN, so workflow_run is required.
      # Always deploy current main, not the pre-scan head_sha.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure dedicated deployment identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS" && test -n "$DEPLOY_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/pluginworld_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/pluginworld_deploy ~/.ssh/known_hosts
      - name: Publish source archive, validate, build and switch with rollback
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          RELEASE_SHA=$(git rev-parse HEAD)
          git archive --format=tar.gz HEAD | \
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/pluginworld_deploy \
            "$DEPLOY_HOST" "deploy $RELEASE_SHA"
      - name: Public production acceptance
        run: |
          node scripts/deploy/check-production.mjs https://pluginworld.ai
