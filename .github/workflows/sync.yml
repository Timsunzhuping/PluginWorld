# Daily full-community scan (spec §6 + security gate):
# crawls GitHub topics, the official MCP Registry, the npm registry and the
# optional Glama directory; reviews and publishes a snapshot, then CD runs.
name: daily-community-scan

on:
  schedule:
    - cron: "0 2 * * *" # daily 02:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run ingestion pipeline (all sources + security scan)
        env:
          # GITHUB_TOKEN raises API rate limits (spec §6)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GLAMA_API_KEY: ${{ secrets.GLAMA_API_KEY }}
        run: npx tsx scripts/sync/run-all.ts --pages 5 --skills-limit 1000

      - name: Validate generated catalog and application
        run: npm run typecheck && npm run lint && npm test

      - name: Save review evidence
        uses: actions/upload-artifact@v4
        with:
          name: catalog-review
          path: |
            src/data/seed/sync-report.json
            src/data/seed/skills-audit.json
            src/data/seed/quarantine.json
          retention-days: 30

      - name: Commit snapshot (keeps demo-mode data fresh too)
        run: |
          git config user.name "pluginworld-bot"
          git config user.email "bot@pluginworld.ai"
          git add src/data/seed
          git diff --cached --quiet || git commit -m "chore(sync): daily community scan snapshot [skip ci]"
          # Never overwrite a concurrent human commit; a race fails safely.
          git push origin HEAD:main


  test:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
