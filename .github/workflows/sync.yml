# Daily full-community scan (spec §6 + security gate):
# crawls GitHub topics, the official MCP Registry, the npm registry and the
# Glama directory; runs the pre-index security scan (grade D → quarantined);
# scores and upserts everything, then triggers ISR revalidation.
name: daily-community-scan

on:
  schedule:
    - cron: "0 2 * * *" # daily 02:00 UTC
  workflow_dispatch: {}

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run ingestion pipeline (all sources + security scan)
        env:
          # GITHUB_TOKEN raises API rate limits (spec §6)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/sync/run-all.ts --pages 5 --db

      - name: Commit snapshot (keeps demo-mode data fresh too)
        run: |
          git config user.name "pluginworld-bot"
          git config user.email "bot@pluginworld.ai"
          git add src/data/seed
          git diff --cached --quiet || git commit -m "chore(sync): daily community scan snapshot [skip ci]"
          git push

      - name: Trigger ISR revalidation
        if: ${{ vars.SITE_URL != '' }}
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          curl -sf -X POST "${{ vars.SITE_URL }}/api/revalidate" \
            -H "Authorization: Bearer $REVALIDATE_SECRET" || true

  test:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
