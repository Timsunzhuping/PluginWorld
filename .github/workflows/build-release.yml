name: build-production-release
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run typecheck && npm run lint && npm test && npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Package verified Linux build with exact source
        run: |
          mkdir release
          git archive HEAD | tar -x -C release
          cp -a .next release/.next
          rm -rf release/.next/cache
          git rev-parse HEAD > release/.build-commit
          tar -czf pluginworld-production.tar.gz -C release .
      - uses: actions/upload-artifact@v4
        with:
          name: pluginworld-production
          path: pluginworld-production.tar.gz
          retention-days: 7
