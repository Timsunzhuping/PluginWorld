# PluginWorld — nginx virtual host (name-based, safe to add next to existing sites)
# Install: copy to /etc/nginx/conf.d/pluginworld.conf  (or sites-available + symlink)
# Then: nginx -t && systemctl reload nginx
# HTTPS: certbot --nginx -d pluginworld.ai -d www.pluginworld.ai
#        (certbot rewrites this file to add the 443 server block automatically)

server {
    listen 80;
    listen [::]:80;
    server_name pluginworld.ai www.pluginworld.ai;

    # Next.js production server
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Long-cache immutable Next.js build assets
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
